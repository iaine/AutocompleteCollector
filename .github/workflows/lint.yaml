name: Lint Workflow
on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.9]
    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm init
      - run: npm init @eslint/config@latest      
      - run: npm run lint
      